<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Form</title>
    <link rel="stylesheet" href="styles-iniciarSesionn.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
  <body>

    <button class="exit-btn" onclick="window.location.href='../index.php'">Volver a la web</button>
    <div class="flex-container">
      <div class="container">
          <div class="form-box login">
              <form action="iniciar_sesion.php" method="post">
                  <h1>Iniciar Sesion</h1>
                  <div class="input-box">
                      <input type="text" name="nombre" placeholder="Nombre de usuario" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" name="contraseña" placeholder="Contraseña" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <div class="forgot-link">
                      <a href="#">Olvidaste la contraseña?</a>
                  </div>
                  <button type="submit" class="btn">Entrar</button>
                  <p>iniciar sesion con red social</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-github' ></i></a>
                      <a href="#"><i class='bx bxl-linkedin' ></i></a>
                  </div>
              </form>
          </div>

          <div class="form-box register">
              <form action="insertar_usuario.php" method="post">
                  <h1>Registrate</h1>
                  <div class="input-box">
                      <input type="text" name="nombre" placeholder="Nombre de usuario" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                    <input type="text" name="dni" placeholder="DNI" required>
                    <i class='bx bxs-user'></i>
                </div>
                  <div class="input-box">
                      <input type="email" name="correo" placeholder="Email" required>
                      <i class='bx bxs-envelope' ></i>
                  </div>
                  <div class="input-box">
                      <input type="password" name="contraseña" placeholder="Contraseña" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>
                  <button type="submit" class="btn">Registrar</button>
                  <p>registrase con red social</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-github' ></i></a>
                      <a href="#"><i class='bx bxl-linkedin' ></i></a>
                  </div>
              </form>
          </div>

          <div class="toggle-box">
              <div class="toggle-panel toggle-left">
                  <h1>Bienvenido!</h1>
                  <p>No tienes cuenta todavía?</p>
                  <button class="btn register-btn">Registrate</button>
              </div>

              <div class="toggle-panel toggle-right">
                  <h1>Hola de Nuevo!</h1>
                  <p>Ya tienes una cuenta?</p>
                  <button class="btn login-btn">Iniciar Sesion</button>
              </div>
          </div>
      </div>
    </div>

      <script src="scripts_iniciarSesion.js"></script>
  </body>
</html>
